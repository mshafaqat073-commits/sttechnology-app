# Deploys the Flutter web app to Firebase Hosting on every push to main.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate secrets.dart from GitHub Secrets
        run: |
          cat > lib/secrets.dart << EOF
          const String groqApiKey = "${{ secrets.GROQ_API_KEY }}";
          const String openRouterApiKey = "${{ secrets.OPENROUTER_API_KEY }}";
          const String notificationEndpoint = "${{ secrets.NOTIFICATION_ENDPOINT }}";
          const String notificationSharedSecret = "${{ secrets.NOTIFICATION_SHARED_SECRET }}";
          EOF

      - name: Build web app
        run: flutter build web --release

      - name: Copy version.json into build output
        run: cp lib/version.json build/web/version.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AEPSCHOOLSYSTEM_59874 }}
          channelId: live
          projectId: aepschoolsystem-59874
