name: aep_school_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_storage: ^13.4.5
  image_picker: ^1.2.3
  cloudinary_public: ^0.23.1
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.3.0
  pdf: ^3.10.0
  printing: ^5.11.0
  path_provider: ^2.1.0
  path_provider_windows: ^2.3.0
  share_plus: 12.0.2
  shared_preferences: ^2.5.5
  csv: ^8.0.0
  excel: ^4.0.6
  http: ^1.6.0
  rxdart: ^0.28.0
  qr_flutter: ^4.1.0
  file_picker: ^10.3.2
  intl: ^0.20.3      
  window_manager: ^0.5.2
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0
  mobile_scanner: ^6.0.2
  package_info_plus: ^8.0.0
  open_file: ^3.3.2
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/st_technology_shafaqat_trust.png
    - assets/fonts/static/NotoNastaliqUrdu-Regular.ttf
    - assets/fonts/static/NotoNaskhArabic-Regular.ttf

msix_config:
  display_name: ST Education
  publisher_display_name: ST Technology
  identity_name: com.sttechnology.steducation
  msix_version: 1.0.2.0
  logo_path: assets/st_technology_shafaqat_trust.png
